{% extends 'base.html' %}

{% block content %}
<h1>Tables Affectées</h1>
<table>
    <tr>
        <th>Numéro de Table</th>
        <th>Capacité</th>
        <th>Disponibilité</th>
    </tr>
    {% for table in tables %}
    <tr>
        <td>{{ table.number }}</td>
        <td>{{ table.capacity }}</td>
        <td>{{ table.is_available|yesno }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
