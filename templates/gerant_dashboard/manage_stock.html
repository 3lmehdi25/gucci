{% extends "base.html" %}

{% block content %}
<h1>Manage Stock</h1>
<a href="{% url 'gerant_dashboard:add_stock' %}" class="btn btn-primary">Add Stock Item</a>

<table border="1">
    <tr>
        <th>Item</th>
        <th>Quantity</th>
        <th>Actions</th>
    </tr>
    {% for stock in stock_items %}
    <tr>
        <td>{{ stock.item }}</td>
        <td>{{ stock.quantity }}</td>
        <td>
            <a href="{% url 'gerant_dashboard:edit_stock' stock.id %}">Edit</a> |
            <a href="{% url 'gerant_dashboard:delete_stock' stock.id %}">Delete</a>
        </td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="3">No stock items found.</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
