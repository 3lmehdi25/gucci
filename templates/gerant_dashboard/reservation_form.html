{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Reserve Table {{ form.instance.table.number }}</h2>

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label for="id_client_name" class="form-label">Client Name</label>
            {{ form.client_name }}
        </div>

        <div class="mb-3">
            <label for="id_client_contact" class="form-label">Client Contact</label>
            {{ form.client_contact }}
        </div>

        <div class="mb-3">
            <label for="id_date" class="form-label">Date</label>
            {{ form.date }}
        </div>

        <div class="mb-3">
            <label for="id_time" class="form-label">Time</label>
            {{ form.time }}
        </div>

        <button type="submit" class="btn btn-primary">Reserve</button>
        <a href="{% url 'gerant_dashboard:reservation_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
