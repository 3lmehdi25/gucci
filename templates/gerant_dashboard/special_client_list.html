{% extends "base.html" %}

{% block content %}
<h1>Special Clients</h1>

<a href="{% url 'gerant_dashboard:add_special_client' %}" class="btn btn-primary">Add Special Client</a>

<table class="table">
    <thead>
        <tr>
            <th>Username</th>
            <th>Type</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for client in special_clients %}
        <tr>
            <td>{{ client.user.username }}</td>
            <td>{{ client.get_type_display }}</td>
            <td>
                <a href="{% url 'gerant_dashboard:edit_special_client' client.id %}" class="btn btn-warning">Edit</a>
                <a href="{% url 'gerant_dashboard:delete_special_client' client.id %}" class="btn btn-danger">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">No special clients found.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
