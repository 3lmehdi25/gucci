{% extends "base.html" %}

{% block content %}
<h1>Edit Table {{ table.number }}</h1>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Update</button>
    <a href="{% url 'gerant_dashboard:list_tables' %}" class="btn btn-secondary">Cancel</a>
</form>

{% endblock %}
