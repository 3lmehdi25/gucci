{% extends "base.html" %}

{% block content %}
<h1>Table Management</h1>

<a href="{% url 'gerant_dashboard:add_table' %}" class="btn btn-primary">Add New Table</a>

{% if tables %}
<table class="table">
    <thead>
        <tr>
            <th>Table Number</th>
            <th>Seats</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for table in tables %}
        <tr>
            <td>{{ table.number }}</td>
            <td>{{ table.seats }}</td>
            <td>
                <a href="{% url 'gerant_dashboard:edit_table' table.id %}" class="btn btn-warning btn-sm">Edit</a>
                <a href="{% url 'gerant_dashboard:delete_table' table.id %}" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure?');">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% else %}
<p>No tables added yet.</p>
{% endif %}

{% endblock %}
