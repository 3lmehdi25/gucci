{% extends "base.html" %}

{% block content %}
<h1>{% if form.instance.id %}Edit{% else %}Add{% endif %} Stock Item</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
</form>

<a href="{% url 'gerant_dashboard:manage_stock' %}">Cancel</a>
{% endblock %}
